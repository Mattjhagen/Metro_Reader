<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="80%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Page Gradients -->
    <linearGradient id="cyan-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="purple-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Filter for subtle neon bloom -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg-glow)"/>
  <rect width="512" height="512" rx="110" fill="url(#cyan-glow)"/>

  <!-- Main Container centered -->
  <g transform="translate(0, 8)" filter="url(#neon-glow)">
    <!-- LEFT PAGE (Cyan) -->
    <path d="M 90 135 C 150 125, 205 150, 235 185 L 235 375 C 205 340, 150 325, 90 345 Z" 
          fill="url(#cyan-page)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- RIGHT PAGE (Purple/Magenta) -->
    <path d="M 422 135 C 362 125, 307 150, 277 185 L 277 375 C 307 340, 362 325, 422 345 Z" 
          fill="url(#purple-page)" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- LEFT BOTTOM CURVED STRIP -->
    <path d="M 90 365 C 150 345, 205 360, 235 395 L 235 412 C 205 377, 150 362, 90 382 Z" 
          fill="url(#cyan-page)"/>

    <!-- RIGHT BOTTOM CURVED STRIP -->
    <path d="M 422 365 C 362 345, 307 360, 277 395 L 277 412 C 307 377, 362 362, 422 382 Z" 
          fill="url(#purple-page)"/>

    <!-- CENTER PLAY BUTTON (Dark Silhouette) -->
    <polygon points="230,195 315,250 230,305" fill="#030712" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- SOUNDWAVE ARCS (Inside Right Page) -->
    <!-- Arc 1 -->
    <path d="M 320 220 A 45 45 0 0 1 350 280" fill="none" stroke="#030712" stroke-width="14" stroke-linecap="round"/>
    <path d="M 320 220 A 45 45 0 0 1 350 280" fill="none" stroke="#fdf4ff" stroke-width="3" stroke-linecap="round"/>

    <!-- Arc 2 -->
    <path d="M 345 195 A 80 80 0 0 1 390 305" fill="none" stroke="#030712" stroke-width="16" stroke-linecap="round"/>
    <path d="M 345 195 A 80 80 0 0 1 390 305" fill="none" stroke="#fdf4ff" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Arc 3 -->
    <path d="M 370 170 A 115 115 0 0 1 425 330" fill="none" stroke="#030712" stroke-width="18" stroke-linecap="round"/>
    <path d="M 370 170 A 115 115 0 0 1 425 330" fill="none" stroke="#fdf4ff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
